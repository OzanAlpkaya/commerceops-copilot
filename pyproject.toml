[project]
name = "commerceops-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "mock_api",
    "copilot",
    "lumora_corpus",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# src layout: lets isort tell workspace packages (first-party) from dependencies.
src = ["mock_api/src", "copilot/src", "lumora_corpus/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
include = ["mock_api", "copilot", "lumora_corpus"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["mock_api/tests", "copilot/tests", "lumora_corpus/tests"]
addopts = "--import-mode=importlib"
