services:
  db:
    image: pgvector/pgvector:pg17
    container_name: commerceops-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerceops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerceops}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
