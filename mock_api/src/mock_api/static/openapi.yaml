openapi: 3.0.3
info:
  title: Lumora Order API
  version: 2.0.0
  description: |
    Internal order API used by the Lumora mobile app and integrations.

    Authentication: send your API key in the `X-API-Key` header. Keys are issued by IT,
    one per client.

    List endpoints are paginated with an opaque `cursor`: pass the `next_cursor` of the
    previous page to get the next one. `next_cursor` is null on the last page.

    Last reviewed: September 2025 (order system v2).
servers:
  - url: https://orders.lumora.internal
security:
  - ApiKey: []

paths:
  /customers/{customer_id}:
    get:
      summary: Get a customer
      operationId: getCustomer
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: The customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /customers:
    get:
      summary: List customers
      operationId: listCustomers
      parameters:
        - name: email
          in: query
          description: Exact email address (case-insensitive).
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of customers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /orders/{order_id}:
    get:
      summary: Get an order with its items
      operationId: getOrder
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orders:
    get:
      summary: List orders, newest first
      operationId: listOrders
      parameters:
        - name: customer_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of orders (without items)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/OrderSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /orders/{order_id}/shipment:
    get:
      summary: Get the shipment of an order
      operationId: getOrderShipment
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /products/{sku}:
    get:
      summary: Get a product
      operationId: getProduct
      parameters:
        - name: sku
          in: path
          required: true
          schema: { type: string, example: LUM-BED-10001 }
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /products:
    get:
      summary: List products
      operationId: listProducts
      parameters:
        - name: supplier_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of products, by SKU
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /returns/{return_id}:
    get:
      summary: Get a return
      operationId: getReturn
      parameters:
        - name: return_id
          in: path
          required: true
          schema: { type: string, example: RMA-100001 }
      responses:
        "200":
          description: The return
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Return" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /returns:
    get:
      summary: List returns, newest first
      operationId: listReturns
      parameters:
        - name: order_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of returns
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Return" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a return request
      operationId: createReturn
      description: |
        Creates a return with status `requested` for items of a delivered order.
        Retrying with the same `Idempotency-Key` and body returns the original response.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnCreate" }
      responses:
        "201":
          description: Return created (or replayed)
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Return" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema: { type: string, example: CUS-000001 }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: string, example: LH-1000001 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request (for example a missing Idempotency-Key)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: The request is well-formed but cannot be processed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: order_not_found }
            message: { type: string }

    Page:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {}
        next_cursor:
          type: string
          nullable: true

    Money:
      type: string
      format: decimal
      example: "59.90"

    Customer:
      type: object
      properties:
        id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        address_line: { type: string }
        city: { type: string }
        postcode: { type: string }
        country: { type: string, example: IE }
        created_at: { type: string, format: date-time }

    Product:
      type: object
      properties:
        sku: { type: string }
        name: { type: string }
        category: { type: string, example: bedding_bath }
        product_type: { type: string, example: Pillow }
        supplier_id: { type: string }
        list_price: { $ref: "#/components/schemas/Money" }
        weight_g: { type: integer, nullable: true }
        length_cm: { type: integer, nullable: true }
        height_cm: { type: integer, nullable: true }
        width_cm: { type: integer, nullable: true }

    OrderStatus:
      type: string
      enum: [pending, processing, shipped, delivered, canceled]

    OrderSummary:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        placed_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
        subtotal: { $ref: "#/components/schemas/Money" }
        shipping_fee: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        payment_method: { type: string, enum: [card, bank_transfer] }

    Order:
      allOf:
        - $ref: "#/components/schemas/OrderSummary"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/OrderItem" }

    OrderItem:
      type: object
      properties:
        id: { type: integer }
        line_no: { type: integer }
        sku: { type: string }
        product_name: { type: string }
        quantity: { type: integer }
        unit_price: { $ref: "#/components/schemas/Money" }
        shipping_fee: { $ref: "#/components/schemas/Money" }

    Shipment:
      type: object
      properties:
        id: { type: string }
        order_id: { type: string }
        carrier: { type: string }
        tracking_number: { type: string }
        tracking_url: { type: string, format: uri }
        status: { type: string, enum: [in_transit, delivered] }
        shipped_at: { type: string, format: date-time, nullable: true }
        eta: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }

    ReturnItem:
      type: object
      required: [order_item_id, quantity, condition]
      properties:
        order_item_id: { type: integer }
        quantity: { type: integer, minimum: 1 }
        condition: { type: string, enum: [unopened, opened, damaged] }

    Return:
      type: object
      properties:
        id: { type: string }
        order_id: { type: string }
        status:
          type: string
          enum: [requested, approved, received, refunded, exchanged, rejected]
        reason:
          type: string
          enum: [defective, changed_mind, wrong_item, damaged_in_transit]
        resolution: { type: string, enum: [refund, exchange], nullable: true }
        requested_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        refund_amount:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          nullable: true
        customer_comment: { type: string, nullable: true }
        agent_note: { type: string, nullable: true }
        source: { type: string, enum: [admin_panel, web, api] }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReturnItem" }

    ReturnCreate:
      type: object
      required: [order_id, reason, items]
      properties:
        order_id: { type: string }
        reason:
          type: string
          enum: [defective, changed_mind, wrong_item, damaged_in_transit]
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReturnItem" }
        customer_comment: { type: string, maxLength: 500 }
