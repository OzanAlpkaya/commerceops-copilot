name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-packages --locked

      # Same image and init SQL as local development; tests create their own database.
      - name: Start Postgres
        run: docker compose up -d --wait db

      - name: Run checks
        run: make check
